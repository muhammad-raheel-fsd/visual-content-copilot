<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bytemotion · slides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ─────────────────────────────────────────────────────────────
         BASE / DEFAULT THEME
         Used by non-curriculum decks (event-loop, generic explainers).
         GitHub-dark palette. Mirrors THEMES.default in src/themes.ts.
      ───────────────────────────────────────────────────────────── */
      :root {
        --bg: #0d1117;
        --bg-gradient-stop: transparent;
        --panel: #161b22;
        --panel-elevated: #1c232d;
        --panel-border: #30363d;
        --text: #c9d1d9;
        --text-strong: #ffffff;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-soft: rgba(88, 166, 255, 0.12);
        --accent-strong: #388bfd;
        --sync: #3fb950;
        --microtask: #d2a8ff;
        --task: #f0883e;
        --api: #f778ba;
        --loop: #58a6ff;
        --warn: #f0883e;
        --on-accent: #0d1117;
        --code-bg: #0d1117;
        --syn-keyword: #ff7b72;
        --syn-string: #a5d6ff;
        --syn-function: #d2a8ff;
        --syn-number: #79c0ff;
        --syn-builtin: #79c0ff;
        --syn-comment: #8b949e;

        /* Type system */
        --font-sans: Inter, system-ui, -apple-system, sans-serif;
        --font-display: Inter, system-ui, sans-serif;
        --font-mono: "Roboto Mono", ui-monospace, monospace;
      }

      /* Per-chapter themes (Horizon, GitHub Dark, One Dark Pro, Catppuccin,
         Tokyo Night, Gruvbox, Nord, Everforest) live in src/themes.ts and are
         applied at runtime as CSS custom properties on <html>. :root above is
         only the fallback before the app script runs. */


      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        overflow: hidden;
      }

      /* Subtle horizon gradient at top of every slide stage — a soft wash of the
         theme accent that fades out quickly. Gives the "handsome" lift without
         distracting from content. Opt-out by setting --bg-gradient-stop: transparent. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 90% 50% at 50% 0%, var(--bg-gradient-stop), transparent 65%);
        z-index: 0;
      }

      code,
      pre,
      .mono {
        font-family: var(--font-mono);
      }

      h1,
      h2,
      h3,
      .display {
        font-family: var(--font-display);
        font-feature-settings: "ss01" on, "ss02" on;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
