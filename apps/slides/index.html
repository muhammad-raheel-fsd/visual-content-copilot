<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      :root {

        --panel: #161b22;
        --panel-border: #30363d;
        --text: #c9d1d9;

        --accent: #58a6ff;
